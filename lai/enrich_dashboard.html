<!DOCTYPE html>
<html lang="en">
<head
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPR Plant Database &mdash; Enrichment Dashboard</title>
<style>
  ": {
    --green:      #1F5C2E;
    --green-lt:   #E8F4EB;
    --green-mid:  #2d7a3a;
    --bg:         #0f1117;
    --bg2:        #1a1d27;
    --bg3:        #232738;
    --border:     rgba(255,255,255,0.08);
    --text:       #e8eaf0;
    --text2:      #9aa0b8;
    --amber:      #f5a623;
    --red:        #e05252;
    --blue:       #4a9eff;
    --font:       'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; min-height: 100vh; }

  /* Header */
  .header { background: var(--green); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
  .header .sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
  .header .clock { margin-left: auto; font-size: 20px; font-weight: 300; color: rgba(255,255,255,0.9); font-variant-numeric: tabular-nums; }

  /* Layout */
  .main { display: grid; grid-template-columns: 300px 1fr; gap: 0; height: calc(100vh - 60px); }

  /* Left panel &mdash; pass status */
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text2); margin-bottom: 12px; }

  .pass { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); background: var(--bg3); cursor: pointer; transition: border-color 0.15s; }
  .pass:hover { border-color: rgba(255,255,255,0.2); }
  .pass.active { border-color: var(--green-mid); }
  .pass-header { display: flex; align-items: center; gap: 8px; }
  .pass-icon { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pass-icon.waiting  { background: var(--text2); }
  .pass-icon.running  { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
  .pass-icon.done     { background: #4caf50; }
  .pass-icon.fail     { background: var(--red); }
  .pass-icon.skip     { background: var(--text2); opacity: 0.4; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .pass-name { font-weight: 600; font-size: 12px; flex: 1; }
  .pass-status { font-size: 11px; color: var(--text2); }
  .pass-status.running { color: var(--amber); }
  .pass-status.done    { color: #4caf50; }
  .pass-status.fail    { color: var(--red); }

  .pass-progress { margin-top: 8px; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green-mid); border-radius: 2px; transition: width 0.5s ease; }
  .progress-text { font-size: 10px; color: var(--text2); margin-top: 4px; display: flex; justify-content: space-between; }

  /* Summary strip */
  .summary { padding: 12px 16px; border-top: 1px solid var(--border); margin-top: auto; }
  .summary h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text2); margin-bottom: 10px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--bg3); border-radius: 6px; padding: 8px 10px; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 10px; color: var(--text2); margin-top: 2px; }

  /* Right panel &mdash; log output */
  .logpanel { display: flex; flex-direction: column; background: var(--bg); }
  .logpanel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--bg2); }
  .logpanel-header h2 { font-size: 13px; font-weight: 600; }
  .log-controls { margin-left: auto; display: flex; gap: 8px; }
  .btn { padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 11px; cursor: pointer; }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }

  .log-output { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: 'Consolas','Cascadia Code',monospace; font-size: 12px; line-height: 1.6; }
  .log-line { padding: 1px 0; }
  .log-line.ts    { color: var(--text2); }
  .log-line.ok    { color: #4caf50; }
  .log-line.fail  { color: var(--red); }
  .log-line.skip  { color: var(--text2); opacity: 0.6; }
  .log-line.start { color: var(--blue); font-weight: 600; }
  .log-line.head  { color: var(--green-mid); font-weight: 600; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }

  /* Config panel */
  .config { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg2); }
  .config h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text2); margin-bottom: 10px; }
  .config-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .config-label { font-size: 11px; color: var(--text2); width: 100px; flex-shrink: 0; }
  .config-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 11px; }
  .config-note { font-size: 10px; color: var(--text2); margin-top: 4px; }
</style>
</head>
